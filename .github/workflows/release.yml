# Release: git tag v1.2.3 && git push origin v1.2.3
# Builds ClipKeeper.exe with the version from the tag, signs it through SignPath if that is set up (see "Sign"),
# runs the self-test and publishes a release:
#   ClipKeeper-<version>.zip — for a first install: the app + ffmpeg/ffprobe (BtbN build, GPL) + README with pictures;
#   ClipKeeper.exe           — for an update: replace the file next to the old one, settings stay;
#   SHA256SUMS.txt           — checksums.
# A tag with a hyphen (v1.2.0-beta.1) is published as a pre-release.
# The release notes start with the version's section of CHANGELOG.md: no section — no release (see "Changes from CHANGELOG.md").
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read   # SignPath reads this run's details and the unsigned exe artifact

env:
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip

jobs:
  release:
    runs-on: windows-latest
    env:
      # optional code signing through SignPath (free for open source, certificate by SignPath Foundation):
      # repository variable SIGNPATH_ORGANIZATION_ID and secret SIGNPATH_API_TOKEN; SIGNPATH_PROJECT_SLUG and
      # SIGNPATH_POLICY_SLUG only if they differ from ClipKeeper / release-signing. The artifact configuration to
      # paste into the SignPath project is .signpath/artifact-configuration.xml.
      # Without them the exe stays unsigned and Windows SmartScreen warns about it on the first start
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      # optional VirusTotal scan of ClipKeeper.exe, linked in the release notes: repository secret VIRUSTOTAL_API_KEY
      # (a free key: virustotal.com → your profile → API key). Without it the step is skipped
      HAS_VIRUSTOTAL: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Version from tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$') { throw "tag $tag does not look like v1.2.3 or v1.2.3-beta.1" }
          $num = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          $ver = $tag.Substring(1)
          $f = 'src\AssemblyInfo.cs'
          $t = Get-Content $f -Raw -Encoding UTF8
          $t = $t -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$num`")"
          $t = $t -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$num`")"
          $t = $t -replace 'AssemblyInformationalVersion\("[^"]*"\)', "AssemblyInformationalVersion(`"$ver`")"
          Set-Content $f $t -Encoding UTF8 -NoNewline
          "VERSION=$ver" >> $env:GITHUB_ENV
          "PRERELEASE=$(if ($Matches[4]) { 'true' } else { 'false' })" >> $env:GITHUB_ENV

      # the release notes start with this version's section of CHANGELOG.md ("## [1.2.3] - date" up to the next "## [").
      # A release without one stops here, before anything is built; a pre-release may use "## [Unreleased]" instead
      - name: Changes from CHANGELOG.md
        shell: pwsh
        run: |
          $log = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          function Section($name) {
            $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($name))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)")
            if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          }
          $changes = Section $env:VERSION
          if (-not $changes -and $env:PRERELEASE -eq 'true') { $changes = Section 'Unreleased' }
          if (-not $changes) {
            throw "CHANGELOG.md has no section for $($env:VERSION). Rename '## [Unreleased]' to '## [$($env:VERSION)] - $(Get-Date -Format yyyy-MM-dd)', commit, move the tag and push it again"
          }
          # a release shows every line break, so an item wrapped onto indented lines becomes one line again
          $changes = $changes -replace '\r?\n[ \t]+(?=\S)', ' '
          Set-Content changes.md $changes -Encoding UTF8
          $changes

      - name: Build
        shell: cmd
        run: build.cmd

      # SignPath takes the exe as a run artifact, checks that it was built here from this tag and that its metadata is
      # ClipKeeper <version>, waits for a manual approval in SignPath and returns the signed exe
      - name: Upload the unsigned exe
        id: unsigned
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: ClipKeeper.exe
          retention-days: 1

      - name: Sign
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ClipKeeper' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # time to approve the request in SignPath
          output-artifact-directory: signed

      - name: Check the signature
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed\ClipKeeper.exe ClipKeeper.exe -Force
          $s = Get-AuthenticodeSignature .\ClipKeeper.exe
          if ($s.Status -ne 'Valid') { throw "the signature does not verify: $($s.Status) $($s.StatusMessage)" }
          "signed by $($s.SignerCertificate.Subject)"

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process .\ClipKeeper.exe -ArgumentList '--selftest' -PassThru -Wait
          Get-Content selftest.txt -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }
          $got = (Get-Item .\ClipKeeper.exe).VersionInfo.ProductVersion
          if ($got -ne $env:VERSION) { throw "the exe has version $got, but the tag is $env:VERSION" }

      - name: ffmpeg
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest $env:FFMPEG_URL -OutFile $zip
          Expand-Archive $zip $dir
          $root = Get-ChildItem $dir -Directory | Select-Object -First 1
          "FFMPEG_ROOT=$($root.FullName)" >> $env:GITHUB_ENV
          $line = (& (Join-Path $root.FullName 'bin\ffmpeg.exe') -hide_banner -version | Select-Object -First 1) -replace ' Copyright.*', ''
          "FFMPEG_VERSION=$line" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $pkg = "dist\ClipKeeper"
          New-Item -ItemType Directory -Force "$pkg\ffmpeg" | Out-Null
          Copy-Item ClipKeeper.exe, README.md, README.ru.md, CHANGELOG.md, LICENSE $pkg
          Copy-Item docs $pkg -Recurse   # the README pictures
          Copy-Item "$env:FFMPEG_ROOT\bin\ffmpeg.exe", "$env:FFMPEG_ROOT\bin\ffprobe.exe", "$env:FFMPEG_ROOT\LICENSE.txt" "$pkg\ffmpeg"
          Compress-Archive "$pkg" "dist\ClipKeeper-$env:VERSION.zip"
          Copy-Item ClipKeeper.exe dist
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii

      # the exe goes to VirusTotal; the release notes get the link and, if the scan is done in time, its result.
      # Only the exe: the zip is the same exe plus the official ffmpeg. A VirusTotal problem never stops the release
      - name: VirusTotal
        if: env.HAS_VIRUSTOTAL == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $h = @{ 'x-apikey' = $env:VT_KEY }
          $sha = (Get-FileHash dist\ClipKeeper.exe -Algorithm SHA256).Hash.ToLower()
          $up = Invoke-RestMethod -Method Post -Uri https://www.virustotal.com/api/v3/files -Headers $h -Form @{ file = Get-Item dist\ClipKeeper.exe }
          $link = "https://www.virustotal.com/gui/file/$sha"
          $note = "VirusTotal: [ClipKeeper.exe]($link)"
          # the free API allows 4 requests a minute: ask every 30 s, up to 6 minutes
          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep 30
            $a = (Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$($up.data.id)" -Headers $h).data.attributes
            if ($a.status -eq 'completed') {
              $s = $a.stats
              $flagged = $s.malicious + $s.suspicious
              $total = $s.malicious + $s.suspicious + $s.undetected + $s.harmless
              $note = "VirusTotal: [ClipKeeper.exe — $flagged / $total]($link)"
              break
            }
          }
          $note
          "VT_NOTE=$note" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **First install** — ClipKeeper-$env:VERSION.zip: unpack into any folder and run ClipKeeper.exe.
          **Update** — close ClipKeeper in the tray and replace ClipKeeper.exe with the new one. Settings, the device reference and covers stay.

          **Первая установка** — ClipKeeper-$env:VERSION.zip: распаковать в любую папку и запустить ClipKeeper.exe.
          **Обновление** — закрыть ClipKeeper в трее и заменить ClipKeeper.exe новым. Настройки, эталон устройств и обложки останутся.

          ffmpeg in the zip: $env:FFMPEG_VERSION ([BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds), GPL, sources there).

          $env:VT_NOTE
          "@
          # what changed (CHANGELOG.md, the "Changes" step) first, then how to install
          $notes = (Get-Content changes.md -Raw -Encoding UTF8).Trim() + "`n`n---`n`n" + $notes
          Set-Content notes.md $notes -Encoding UTF8
          $flags = @('--title', "ClipKeeper $env:VERSION", '--notes-file', 'notes.md', '--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist -File).FullName @flags
